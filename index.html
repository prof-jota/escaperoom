<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumanji - Portal de Entrada</title>
  <!-- Fontes Estilo Jumanji / Aventura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. ESTILOS GERAIS E VARIÁVEIS
       ========================================================================== */
    :root {
      --gold: #dfb250;
      --gold-bright: #ffd700;
      --emerald: #0f6e43;
      --emerald-glow: #10b981;
      --wood-dark: #120904;
      --wood-medium: #2a170a;
      --bg-dark: #070a08;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Fundo dinâmico da selva */
    .jungle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at center, rgba(15, 110, 67, 0.15) 0%, rgba(7, 10, 8, 0.95) 75%),
        radial-gradient(circle at 20% 20%, rgba(223, 178, 80, 0.08) 0%, transparent 40%),
        linear-gradient(to bottom, #070a08, #120904);
      z-index: 1;
    }

    /* ==========================================================================
       2. TELA 1: FORMULÁRIO DE JOGADORES (ENTRADA)
       ========================================================================== */
    .setup-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 580px;
      background: linear-gradient(145deg, rgba(42, 23, 10, 0.92), rgba(18, 9, 4, 0.96));
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 0 35px rgba(223, 178, 80, 0.25),
        inset 0 0 20px rgba(0, 0, 0, 0.8);
      text-align: center;
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .title-banner {
      margin-bottom: 2rem;
    }

    .title-sub {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      letter-spacing: 4px;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .title-main {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.8rem;
      color: var(--gold-bright);
      text-shadow: 
        0 0 12px rgba(255, 215, 0, 0.6),
        3px 3px 0px #000;
      letter-spacing: 2px;
    }

    .players-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2rem;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-badge {
      position: absolute;
      left: 12px;
      width: 30px;
      height: 30px;
      background: var(--gold);
      color: var(--wood-dark);
      font-family: 'Cinzel', serif;
      font-weight: 900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .player-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3.2rem;
      background: rgba(10, 5, 2, 0.7);
      border: 2px solid rgba(223, 178, 80, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .player-input:focus {
      border-color: var(--emerald-glow);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      background: rgba(10, 5, 2, 0.9);
    }

    .player-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .btn-enter {
      width: 100%;
      padding: 1.1rem;
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--wood-dark);
      background: linear-gradient(185deg, var(--gold-bright), #b8860b);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 
        0 6px 0 #6d4c0f,
        0 10px 20px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 0 #6d4c0f,
        0 14px 25px rgba(223, 178, 80, 0.4);
      filter: brightness(1.1);
    }

    .btn-enter:active {
      transform: translateY(4px);
      box-shadow: 
        0 2px 0 #6d4c0f,
        0 5px 10px rgba(0,0,0,0.6);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      min-height: 1.2rem;
      display: none;
    }

    /* ==========================================================================
       3. TELA 2: ANIMAÇÃO DE VÓRTEX / SER PUXADO PARA DENTRO
       ========================================================================== */
    .vortex-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    canvas#vortexCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .vortex-warning {
      position: relative;
      z-index: 101;
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 0 0 20px var(--emerald-glow), 0 0 40px var(--emerald);
      text-align: center;
      animation: pulseText 0.8s infinite alternate;
      padding: 0 1rem;
    }

    @keyframes pulseText {
      from { transform: scale(0.95); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #fff, 0 0 50px var(--gold-bright); }
    }

    /* Efeito de Tremor na Tela Toda */
    .shake {
      animation: cameraShake 0.1s infinite;
    }

    @keyframes cameraShake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, -2px) rotate(-1deg); }
      40% { transform: translate(-1px, 3px) rotate(1deg); }
      60% { transform: translate(3px, 1px) rotate(0deg); }
      80% { transform: translate(1px, -2px) rotate(1deg); }
      100% { transform: translate(-2px, 2px) rotate(-1deg); }
    }

    /* Flash Branco de Transição */
    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }

    /* ==========================================================================
       4. TELA 3: TELA FINAL DE CHEGADA A JUMANJI
       ========================================================================== */
    .jumanji-world {
      position: relative;
      z-index: 20;
      width: 95%;
      max-width: 1200px;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .welcome-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .welcome-header h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      letter-spacing: 5px;
      font-size: 1.2rem;
    }

    .welcome-header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3.5rem;
      color: var(--gold-bright);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-top: 0.5rem;
    }

    /* Grid dos Avatares dos 5 Jogadores */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.5rem;
      width: 100%;
      margin-bottom: 3rem;
    }

    .character-card {
      background: rgba(30, 15, 5, 0.85);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .character-card:hover {
      transform: translateY(-8px);
      border-color: var(--emerald-glow);
    }

    .avatar-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--emerald) 0%, var(--wood-dark) 100%);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    .player-real-name {
      font-size: 0.85rem;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .avatar-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--gold-bright);
      font-weight: 700;
      margin: 0.3rem 0 0.8rem 0;
    }

    .skills-list {
      font-size: 0.78rem;
      color: #cbd5e1;
      text-align: left;
      width: 100%;
      border-top: 1px solid rgba(223, 178, 80, 0.2);
      padding-top: 0.8rem;
    }

    .skills-list strong {
      color: var(--gold);
    }

    .btn-restart {
      padding: 0.9rem 2rem;
      font-family: 'Cinzel', serif;
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .btn-restart:hover {
      background: var(--gold);
      color: var(--wood-dark);
      box-shadow: 0 0 20px rgba(223, 178, 80, 0.4);
    }

    /* Respnsividade */
    @media (max-width: 600px) {
      .title-main { font-size: 2rem; }
      .welcome-header h1 { font-size: 2.2rem; }
      .vortex-warning { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <!-- Fundo Ambiental -->
  <div class="jungle-bg"></div>

  <!-- Camada de Flash Branco para Transição -->
  <div id="flashOverlay" class="flash-overlay"></div>
