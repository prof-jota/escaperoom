<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumanji - Portal de Entrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #dfb250;
      --gold-bright: #ffd700;
      --emerald: #0f6e43;
      --emerald-glow: #10b981;
      --wood-dark: #120904;
      --wood-medium: #2a170a;
      --bg-dark: #070a08;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .jungle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at center, rgba(15, 110, 67, 0.15) 0%, rgba(7, 10, 8, 0.95) 75%),
        radial-gradient(circle at 20% 20%, rgba(223, 178, 80, 0.08) 0%, transparent 40%),
        linear-gradient(to bottom, #070a08, #120904);
      z-index: 1;
    }

    /* TELA 1: FORMULÁRIO */
    .setup-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 580px;
      background: linear-gradient(145deg, rgba(42, 23, 10, 0.92), rgba(18, 9, 4, 0.96));
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 0 35px rgba(223, 178, 80, 0.25),
        inset 0 0 20px rgba(0, 0, 0, 0.8);
      text-align: center;
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .title-banner { margin-bottom: 2rem; }
    .title-sub {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      letter-spacing: 4px;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .title-main {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.8rem;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 3px 3px 0px #000;
      letter-spacing: 2px;
    }

    .players-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2rem;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-badge {
      position: absolute;
      left: 12px;
      width: 30px;
      height: 30px;
      background: var(--gold);
      color: var(--wood-dark);
      font-family: 'Cinzel', serif;
      font-weight: 900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .player-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3.2rem;
      background: rgba(10, 5, 2, 0.7);
      border: 2px solid rgba(223, 178, 80, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .player-input:focus {
      border-color: var(--emerald-glow);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      background: rgba(10, 5, 2, 0.9);
    }

    .player-input::placeholder { color: rgba(255, 255, 255, 0.35); }

    .btn-enter {
      width: 100%;
      padding: 1.1rem;
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--wood-dark);
      background: linear-gradient(185deg, var(--gold-bright), #b8860b);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #6d4c0f, 0 10px 20px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #6d4c0f, 0 14px 25px rgba(223, 178, 80, 0.4);
      filter: brightness(1.1);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }

    /* TELA 2: VÓRTEX DE TRANSIÇÃO */
    .vortex-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      pointer-events: none;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    canvas#vortexCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .vortex-warning {
      position: relative;
      z-index: 101;
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 0 0 20px var(--emerald-glow), 0 0 40px var(--emerald);
      text-align: center;
      animation: pulseText 0.8s infinite alternate;
      padding: 0 1rem;
    }

    @keyframes pulseText {
      from { transform: scale(0.95); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #fff, 0 0 50px var(--gold-bright); }
    }

    .shake { animation: cameraShake 0.1s infinite; }
    @keyframes cameraShake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, -2px) rotate(-1deg); }
      40% { transform: translate(-1px, 3px) rotate(1deg); }
      60% { transform: translate(3px, 1px) rotate(0deg); }
      80% { transform: translate(1px, -2px) rotate(1deg); }
      100% { transform: translate(-2px, 2px) rotate(-1deg); }
    }

    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 200;
      display: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }

    /* TELA 3: CHEGADA */
    .jumanji-world {
      position: relative;
      z-index: 20;
      width: 95%;
      max-width: 1200px;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .welcome-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .welcome-header h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      letter-spacing: 5px;
      font-size: 1.2rem;
    }
    .welcome-header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 3.2rem;
      color: var(--gold-bright);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      margin-top: 0.5rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.5rem;
      width: 100%;
      margin-bottom: 3rem;
    }

    .character-card {
      background: rgba(30, 15, 5, 0.85);
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
    }

    .avatar-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--emerald) 0%, var(--wood-dark) 100%);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 1rem;
    }

    .player-real-name {
      font-size: 0.85rem;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .avatar-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold-bright);
      font-weight: 700;
      margin: 0.3rem 0 0.8rem 0;
    }

    .skills-list {
      font-size: 0.78rem;
      color: #cbd5e1;
      text-align: left;
      width: 100%;
      border-top: 1px solid rgba(223, 178, 80, 0.2);
      padding-top: 0.8rem;
    }

    .skills-list strong { color: var(--gold); }

    .btn-restart {
      padding: 0.9rem 2rem;
      font-family: 'Cinzel', serif;
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .btn-restart:hover {
      background: var(--gold);
      color: var(--wood-dark);
    }

    @media (max-width: 600px) {
      .title-main { font-size: 2rem; }
      .welcome-header h1 { font-size: 2.2rem; }
      .vortex-warning { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="jungle-bg"></div>
  <div id="flashOverlay" class="flash-overlay"></div>

  <div id="vortexOverlay" class="vortex-overlay">
    <canvas id="vortexCanvas"></canvas>
    <div class="vortex-warning">SUGIDOS PELO JOGO!</div>
  </div>

  <!-- TELA 1 -->
  <main id="setupScreen" class="setup-container">
    <div class="title-banner">
      <div class="title-sub">Escape Room</div>
      <h1 class="title-main">JUMANJI</h1>
    </div>

    <form id="jumanjiForm" onsubmit="event.preventDefault(); startJumanjiExperience();">
      <div class="players-form">
        <div class="input-group"><span class="input-badge">1</span><input type="text" class="player-input" placeholder="Nome do Jogador 1" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">2</span><input type="text" class="player-input" placeholder="Nome do Jogador 2" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">3</span><input type="text" class="player-input" placeholder="Nome do Jogador 3" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">4</span><input type="text" class="player-input" placeholder="Nome do Jogador 4" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">5</span><input type="text" class="player-input" placeholder="Nome do Jogador 5" required spellcheck="false"></div>
      </div>
      <button type="submit" class="btn-enter">ENTRAR NO JOGO</button>
      <div id="errorMsg" class="error-msg">Por favor, preencha os 5 nomes.</div>
    </form>
  </main>

  <!-- TELA 3 -->
  <section id="jumanjiScreen" class="jumanji-world">
    <div class="welcome-header">
      <h2>CONSEQUÊNCIAS ACEITAS</h2>
      <h1>BEM-VINDOS A JUMANJI!</h1>
    </div>
    <div id="cardsGrid" class="cards-grid"></div>
    <button class="btn-restart" onclick="resetApp()">JOGAR NOVAMENTE</button>
  </section>

  <script>
    const AVATARS = [
      { role: "Dr. Smolder Bravestone", icon: "⚔️", skills: "Intimidação, Boomerangs, Força Sobre-humana", weakness: "Nenhuma" },
      { role: "Ruby Roundhouse", icon: "🥋", skills: "Artes Marciais, Dança de Combate, Nunchaku", weakness: "Veneno de Serpente" },
      { role: "Prof. Shelly Oberon", icon: "🗺️", skills: "Cartografia, Arqueologia, Geometria", weakness: "Resistência Física / Sol" },
      { role: "Franklin 'Mouse' Finbar", icon: "🎒", skills: "Zoológico, Mochileiro de Armas", weakness: "Bolo / Velocidade" },
      { role: "Jefferson 'Seaplane' McDonough", icon: "🛩️", skills: "Pilotagem de Aeronaves, Margaritas", weakness: "Picada de Mosquito" }
    ];

    // AUDIO CONTROL COM TRATAMENTO DE ERRO
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("Áudio não suportado ou bloqueado:", e);
      }
    }

    function playDrumBeat(freq = 60, duration = 0.4) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playVortexSound(durationSeconds = 4.5) {
      try {
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * durationSeconds;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(100, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + durationSeconds);
        filter.Q.value = 4;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationSeconds);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        whiteNoise.start();
      } catch (e) {}
    }

    // CANVAS ANIMAÇÃO
    let canvas, ctx, particles = [], animationFrameId;

    function setupCanvas() {
      canvas = document.getElementById('vortexCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      resizeCanvas();
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createVortexParticles() {
      particles = [];
      const count = 300;
      for (let i = 0; i < count; i++) {
        particles.push({
          angle: Math.random() * Math.PI * 2,
          radius: Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.8 + 50,
          speed: Math.random() * 0.04 + 0.02,
          size: Math.random() * 3 + 1,
          color: Math.random() > 0.4 ? '#10b981' : '#ffd700',
          radialSpeed: Math.random() * 3 + 1.5
        });
      }
    }

    function drawVortex() {
      if (!ctx) return;
      ctx.fillStyle = 'rgba(7, 10, 8, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      particles.forEach(p => {
        p.angle += p.speed;
        p.radius -= p.radialSpeed;
        if (p.radius <= 5) {
          p.radius = Math.max(canvas.width, canvas.height) * 0.7;
        }
        const x = centerX + Math.cos(p.angle) * p.radius;
        const y = centerY + Math.sin(p.angle) * p.radius;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      animationFrameId = requestAnimationFrame(drawVortex);
    }

    // TRANSIÇÃO DE TELA
    function startJumanjiExperience() {
      const inputs = document.querySelectorAll('.player-input');
      const names = Array.from(inputs).map(inp => inp.value.trim());

      if (names.some(name => name === "")) {
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      initAudio();

      const setupScreen = document.getElementById('setupScreen');
      setupScreen.style.opacity = '0';
      setupScreen.style.transform = 'scale(0.8)';
      
      setTimeout(() => {
        setupScreen.style.display = 'none';
        runVortexSequence(names);
      }, 500);
    }

    function runVortexSequence(playerNames) {
      const vortexOverlay = document.getElementById('vortexOverlay');
      const flashOverlay = document.getElementById('flashOverlay');
      const body = document.body;

      vortexOverlay.style.display = 'flex';
      setTimeout(() => { vortexOverlay.style.opacity = '1'; }, 20);

      setupCanvas();
      createVortexParticles();
      drawVortex();
      playVortexSound(4.5);

      let drumInterval = 450;
      let count = 0;
      function triggerDrums() {
        if (count < 10) {
          playDrumBeat(80 - count * 4, 0.3);
          count++;
          drumInterval = Math.max(70, drumInterval * 0.75);
          setTimeout(triggerDrums, drumInterval);
        }
      }
      triggerDrums();

      body.classList.add('shake');

      // Flash Branco
      setTimeout(() => {
        flashOverlay.style.display = 'block';
        flashOverlay.style.opacity = '1';
      }, 3500);

      // Troca para Tela Final
      setTimeout(() => {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        body.classList.remove('shake');
        
        vortexOverlay.style.opacity = '0';
        vortexOverlay.style.display = 'none';

        renderJumanjiScreen(playerNames);

        setTimeout(() => {
          flashOverlay.style.opacity = '0';
          setTimeout(() => { flashOverlay.style.display = 'none'; }, 400);
        }, 300);
      }, 4000);
    }

    function renderJumanjiScreen(playerNames) {
      const jumanjiScreen = document.getElementById('jumanjiScreen');
      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = '';

      playerNames.forEach((name, index) => {
        const avatar = AVATARS[index % AVATARS.length];
        const card = document.createElement('div');
        card.className = 'character-card';
        card.innerHTML = `
          <div class="avatar-icon">${avatar.icon}</div>
          <div class="player-real-name">${escapeHtml(name)}</div>
          <div class="avatar-title">${avatar.role}</div>
          <div class="skills-list">
            <p><strong>Habilidades:</strong> ${avatar.skills}</p>
            <p style="margin-top:0.4rem;"><strong>Fraqueza:</strong> ${avatar.weakness}</p>
          </div>
        `;
        cardsGrid.appendChild(card);
      });

      jumanjiScreen.style.display = 'flex';
      setTimeout(() => {
        jumanjiScreen.style.opacity = '1';
      }, 50);
    }

    function resetApp() {
      window.location.reload();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
