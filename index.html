<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumanji - Portal de Entrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #dfb250;
      --gold-bright: #ffd700;
      --emerald: #0f6e43;
      --emerald-glow: #10b981;
      --wood-dark: #120904;
      --wood-medium: #2a170a;
      --bg-dark: #070a08;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .jungle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at center, rgba(15, 110, 67, 0.15) 0%, rgba(7, 10, 8, 0.95) 75%),
        radial-gradient(circle at 20% 20%, rgba(223, 178, 80, 0.08) 0%, transparent 40%),
        linear-gradient(to bottom, #070a08, #120904);
      z-index: 1;
    }

    /* TELA 1: FORMULÁRIO DE ENTRADA */
    .setup-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 580px;
      background: linear-gradient(145deg, rgba(42, 23, 10, 0.92), rgba(18, 9, 4, 0.96));
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 0 35px rgba(223, 178, 80, 0.25),
        inset 0 0 20px rgba(0, 0, 0, 0.8);
      text-align: center;
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .title-banner { margin-bottom: 2rem; }
    .title-sub {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      letter-spacing: 4px;
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .title-main {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.8rem;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 3px 3px 0px #000;
      letter-spacing: 2px;
    }

    .players-form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2rem;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-badge {
      position: absolute;
      left: 12px;
      width: 30px;
      height: 30px;
      background: var(--gold);
      color: var(--wood-dark);
      font-family: 'Cinzel', serif;
      font-weight: 900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .player-input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 3.2rem;
      background: rgba(10, 5, 2, 0.7);
      border: 2px solid rgba(223, 178, 80, 0.4);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    .player-input:focus {
      border-color: var(--emerald-glow);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      background: rgba(10, 5, 2, 0.9);
    }

    .player-input::placeholder { color: rgba(255, 255, 255, 0.35); }

    .btn-enter {
      width: 100%;
      padding: 1.1rem;
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--wood-dark);
      background: linear-gradient(185deg, var(--gold-bright), #b8860b);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #6d4c0f, 0 10px 20px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-enter:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #6d4c0f, 0 14px 25px rgba(223, 178, 80, 0.4);
      filter: brightness(1.1);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }

    /* VÓRTEX COM TEXTO TEMPORÁRIO */
    .vortex-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      pointer-events: none;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    canvas#vortexCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .vortex-warning {
      position: relative;
      z-index: 101;
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 0 0 20px var(--emerald-glow), 0 0 40px var(--emerald);
      text-align: center;
      animation: pulseText 0.8s infinite alternate;
      padding: 0 1rem;
      opacity: 1;
      transition: opacity 1s ease; /* Transição suave para desaparecer */
    }

    @keyframes pulseText {
      from { transform: scale(0.95); opacity: 0.8; }
      to { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #fff, 0 0 50px var(--gold-bright); }
    }

    .shake { animation: cameraShake 0.12s infinite; }
    @keyframes cameraShake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      20% { transform: translate(-2px, -2px) rotate(-1deg); }
      40% { transform: translate(-1px, 2px) rotate(1deg); }
      60% { transform: translate(2px, 1px) rotate(0deg); }
      80% { transform: translate(1px, -1px) rotate(1deg); }
      100% { transform: translate(-1px, 2px) rotate(-1deg); }
    }

    @media (max-width: 600px) {
      .title-main { font-size: 2rem; }
      .vortex-warning { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="jungle-bg"></div>

  <!-- CONTAINER DO CANVAS DO VÓRTEX -->
  <div id="vortexOverlay" class="vortex-overlay">
    <canvas id="vortexCanvas"></canvas>
    <div id="vortexWarning" class="vortex-warning">SUGADOS PELO JOGO!</div>
  </div>

  <!-- TELA DE FORMULÁRIO INICIAL -->
  <main id="setupScreen" class="setup-container">
    <div class="title-banner">
      <div class="title-sub"></div>
      <h1 class="title-main">Welcome to the future</h1>
    </div>

    <form id="jumanjiForm" onsubmit="event.preventDefault(); startInfiniteVortex();">
      <div class="players-form">
        <div class="input-group"><span class="input-badge">1</span><input type="text" class="player-input" placeholder="Nome do Jogador 1" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">2</span><input type="text" class="player-input" placeholder="Nome do Jogador 2" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">3</span><input type="text" class="player-input" placeholder="Nome do Jogador 3" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">4</span><input type="text" class="player-input" placeholder="Nome do Jogador 4" required spellcheck="false"></div>
        <div class="input-group"><span class="input-badge">5</span><input type="text" class="player-input" placeholder="Nome do Jogador 5" required spellcheck="false"></div>
      </div>
      <button type="submit" class="btn-enter">ENTRAR NO JOGO</button>
      <div id="errorMsg" class="error-msg">Por favor, preencha os 5 nomes.</div>
    </form>
  </main>

  <script>
    // CONTROLADOR DE ÁUDIO SINTETIZADO
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn("Áudio não suportado:", e);
      }
    }

    function playDrumBeat(freq = 60, duration = 0.4) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playContinuousVortexSound() {
      try {
        if (!audioCtx) return;
        const bufferSize = audioCtx.sampleRate * 3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(400, audioCtx.currentTime);
        filter.Q.value = 3;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        whiteNoise.start();
      } catch (e) {}
    }

    function startInfiniteDrumLoop() {
      function drumStep() {
        playDrumBeat(50 + Math.random() * 25, 0.35);
        const nextBeat = 300 + Math.random() * 350;
        setTimeout(drumStep, nextBeat);
      }
      drumStep();
    }

    // CANVAS DO VÓRTEX
    let canvas, ctx, particles = [];

    function setupCanvas() {
      canvas = document.getElementById('vortexCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      resizeCanvas();
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createVortexParticles() {
      particles = [];
      const count = 350;
      for (let i = 0; i < count; i++) {
        particles.push({
          angle: Math.random() * Math.PI * 2,
          radius: Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.8 + 50,
          speed: Math.random() * 0.04 + 0.02,
          size: Math.random() * 3.5 + 1,
          color: Math.random() > 0.4 ? '#10b981' : '#ffd700',
          radialSpeed: Math.random() * 3 + 1.5
        });
      }
    }

    function drawVortexLoop() {
      if (!ctx) return;
      ctx.fillStyle = 'rgba(7, 10, 8, 0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      particles.forEach(p => {
        p.angle += p.speed;
        p.radius -= p.radialSpeed;
        if (p.radius <= 5) {
          p.radius = Math.max(canvas.width, canvas.height) * 0.75;
        }

        const x = centerX + Math.cos(p.angle) * p.radius;
        const y = centerY + Math.sin(p.angle) * p.radius;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      requestAnimationFrame(drawVortexLoop);
    }

    // INICIAR EXPERIÊNCIA DE VÓRTEX E TIMING DA MENSAGEM
    function startInfiniteVortex() {
      const inputs = document.querySelectorAll('.player-input');
      const names = Array.from(inputs).map(inp => inp.value.trim());

      if (names.some(name => name === "")) {
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      initAudio();

      const setupScreen = document.getElementById('setupScreen');
      setupScreen.style.opacity = '0';
      setupScreen.style.transform = 'scale(0.8)';

      setTimeout(() => {
        setupScreen.style.display = 'none';
        
        const vortexOverlay = document.getElementById('vortexOverlay');
        const warning = document.getElementById('vortexWarning');

        vortexOverlay.style.display = 'flex';
        setTimeout(() => { vortexOverlay.style.opacity = '1'; }, 20);

        setupCanvas();
        createVortexParticles();
        drawVortexLoop();
        playContinuousVortexSound();
        startInfiniteDrumLoop();

        document.body.classList.add('shake');

        // Timer: A mensagem desaparece suavemente após 3,5 segundos
        setTimeout(() => {
          warning.style.opacity = '0';
          setTimeout(() => {
            warning.style.display = 'none';
          }, 1000); // Aguarda o término da transição do CSS
        }, 3500);

      }, 500);
    }

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
